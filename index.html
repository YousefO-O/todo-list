itle" required></div><div><label for="edited-todo-description">Description</label> <textarea name="edited-todo-description" id="edited-todo-description"></textarea></div><div><label for="edited-todo-due-date">Due date</label> <input type="datetime-local" name="edited-todo-due-date" id="edited-todo-due-date"></div><div><label for="edit-todo-priority">Priority</label> <select name="edit-todo-priority" id="edited-todo-priority"><option value="none">None</option><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select></div><div><button type="button" class="close-dialog-button">Close</button> <button type="submit">Edit</button></div></form></dialog></body></html>
