<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
</head>
<body>
    <div id="side-bar">
        <h2>Projects</h2>
        <button id="add-project-button">+</button>
        <div id="projects-container">
            
        </div>
    </div>
    <div id="content"></div>
    <dialog id="new-project-dialog">
        <form action="" id="new-project-form">
            <h3>Create Project</h3>
            <div>
                <label for="project-title">Title</label>
                <input type="text" name="" id="project-title">
            </div>
            <div>
                <button type="button" class="close-dialog-button">Close</button>
                <button type="submit">Create</button>
            </div>
        </form>
    </dialog>
    <dialog id="new-todo-dialog">
        <form id="new-todo-form" action="">
            <h3>Create Todo</h3>
            <div>
                <label for="todo-title">Title</label>
                <input type="text" name="" id="todo-title" required>
            </div>
            <div>
                <label for="todo-description">Description</label>
                <textarea name="todo-description" id="todo-description"></textarea>
            </div>
            <div>
                <label for="todo-due-date">Due date</label>
                <input type="datetime-local" name="todo-due-date" id="todo-due-date">
            </div>
            <div>
                <label for="todo-priority">Priority</label>
                <select name="todo-priority" id="todo-priority">
                    <option value="none">None</option>
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>
            </div>
            <div>
                <button type="button" class="close-dialog-button">Close</button>
                <button type="submit">Create</button>
            </div>
        </form>
    </dialog>
     <dialog id="edit-todo-dialog">
        <form id="edit-todo-form" action="">
            <h3>Edit Todo</h3>
            <div>
                <label for="edited-todo-title">Title</label>
                <input type="text" name="edited-todo-title" id="edited-todo-title">
            </div>
            <div>
                <label for="edited-todo-description">Description</label>
                <textarea name="edited-todo-description" id="edited-todo-description"></textarea>
            </div>
            <div>
                <label for="edited-todo-due-date">Due date</label>
                <input type="datetime-local" name="edited-todo-due-date" id="edited-todo-due-date">
            </div>
            <div>
                <label for="edit-todo-priority">Priority</label>
                <select name="edit-todo-priority" id="edited-todo-priority">
                    <option value="none">None</option>
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>
            </div>
            <div>
                <button type="button" class="close-dialog-button">Close</button>
                <button type="submit">Edit</button>
            </div>
        </form>
    </dialog>
</body>
</html>
